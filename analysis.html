<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理測驗圖表範例</title>
  <style>
   body {
      background-color: #f5f0eb;
      color: #3a3330;
      font-family: Georgia, serif;
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.9;
    }

    h1 {
      font-size: 2rem;
      font-weight: normal;
      text-align: center;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      color: #9e8e85;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      margin: 0 0 1rem;
      text-align: center;
    }

    a {
      color: #3a3330;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #9e8e85;
    }

    .tagline {
      color: #9e8e85;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    .work-item {
      margin-bottom: 1.25rem;
    }

    .work-item a {
      font-size: 1rem;
    }

    .work-item p {
      font-size: 0.9rem;
      color: #9e8e85;
      margin: 0.1rem 0 0;
    }

    .center-block {
        display: block;
        margin: 0 auto;
    }

    /* 當螢幕寬度小於 600px 時（手機） */
    @media (max-width: 600px) {
      body {
        margin: 40px auto;  /* 手機上縮小上下間距 */
        padding: 0 16px;    /* 手機上縮小左右內距 */
      }
      h1 {
        font-size: 1.6rem;  /* 手機上標題稍微縮小 */
      }
    }
    </style>
</head>
<body>
    <h1>心理分析視覺化圖表(2026/6/12)</h1>
    <img src="PHQ9_dist.png" alt="PHQ9分布圖" style="max-width:100%", class="center-block">
    <p>PHQ9分布圖</p>
    <img src="GAD7_gender.png" alt="GAD7性別分數比較圖" style="max-width:50%", class="center-block">
    <p>GAD7性別分數比較圖</p>
</body>
</html>
