<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big 5 位置分析</title>
    <link rel="stylesheet" href="openness.css">
</head>
<body>

    <header>
        <h1>big 5 (大五人格測驗) 位置分析</h1>
        <p>看看你站在人群中的哪裡</p>
    </header>

    <h2>第一步：測出你的Big 5 分數值</h1>
    <p>透過免費、開源的網站，測出你五個維度的數值</p>
    <p><a href="https://bigfive-test.com/zh-hant" target="_blank">免費開源大五人格特質測驗</a></p>
    
    <h2>第二步：填入你的分數</h1>
    <p>填入自己的分數，與所有人的百分比對照。</p>

    <form id="bfi-form">

    <div class="field">
        <label for="o-score">開放性</label>
        <input type="number" id="o-score" min="1" max="5" step="0.1"> 
    </div>
    <div class="field">
        <label for="c-score">嚴謹性</label>
        <input type="number" id="c-score" min="1" max="5" step="0.1">   
    </div>
    <div class="field">
        <label for="e-score">外向性</label>
        <input type="number" id="e-score" min="1" max="5" step="0.1"> 
    </div>
    <div class="field">
        <label for="a-score">親和性</label>
        <input type="number" id="a-score" min="1" max="5" step="0.1"> 
    </div>
    <div class="field">
        <label for="n-score">神經質</label>
        <input type="number" id="n-score" min="1" max="5" step="0.1"> 
    </div>
    <br><button type="submit">看看我站在哪裡</button>
    
</form>
<div id="result-container"></div>
    <!-- 你的故事內容、表單、result-container 都在這裡 -->
    
    <script src="explore.js"></script>

</body>
</html>
