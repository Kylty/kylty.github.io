<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle</title>
  <style>
    body {
      background-color: #e8ded0;
      color: #3d4a42;
      font-family: Georgia, serif;
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.9;
    }

    h1 {
      color: #4a5f5a;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      color: #a68c74;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #a68c74;
      padding-bottom: 0.5rem;
    }

    p {
      margin: 0 0 1rem;
    }

    a {
      color: #9a6850;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #a68c74;
    }

    .tagline {
      color: #8a7e6a;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    /* 導覽列 */
    nav {
      margin-bottom: 3rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    nav a {
      color: #8a7e6a;
      text-decoration: none;
      margin-right: 1.5rem;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #4a5f5a;
    }

    nav a.nav-active {
      color: #3d4a42;
      font-weight: bold;
    }

    /* 作品卡片 */
    .work-card {
      display: flex;
      align-items: flex-start;
      gap: 1.1rem;
      margin-bottom: 1.75rem;
    }

    .work-thumb {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d9c9ae;
      color: #9a6850;
      border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      transition: transform 0.3s ease;
    }

    .work-thumb svg {
      width: 30px;
      height: 30px;
    }

    .work-card:hover .work-thumb {
      transform: scale(1.08) rotate(3deg);
    }

    .work-info a {
      font-size: 1rem;
    }

    .work-date {
      font-size: 0.85rem;
      color: #8a7e6a;
      margin: 0.15rem 0 0.3rem;
    }

    .work-desc {
      font-size: 0.9rem;
      color: #5c5347;
      margin: 0;
    }

    .all-works-link {
      font-size: 0.9rem;
    }

    /* 按鈕 */
    #quote-btn {
      background: transparent;
      border: 1px solid #9a6850;
      color: #9a6850;
      font-family: Georgia, serif;
      font-size: 0.8rem;
      padding: 4px 14px;
      margin-top: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #quote-btn:hover {
      background: rgba(154, 104, 80, 0.1);
    }
    /* 學習進度條 */
    .progress-section {
      margin-bottom: 1.5rem;
    }

    .progress-label {
      font-size: 0.95rem;
      color: #3d4a42;
      margin-bottom: 0.4rem;
    }

    .progress-bar-bg {
      background: #d9c9ae;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: #9a6850;
      height: 100%;
      border-radius: 6px;
      transition: width 0.6s ease;
    }

    .progress-content {
      font-size: 0.85rem;
      color: #8a7e6a;
      margin: 0.35rem 0 0;
    }

    /* 當螢幕寬度小於 600px 時（手機） */
    @media (max-width: 600px) {
      body {
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .work-thumb {
        width: 52px;
        height: 52px;
      }
      .work-thumb svg {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>
<body>

  <nav id="nav-container"></nav>

  <h1>Kyle</h1>
  <p class="tagline">這是一片小小的、雜亂的潮間帶。</p>

  <h2 id="about">關於我</h2>
  <p>一枚不起眼的小拼圖塊，費盡一生在尋找那塊空白。<br><br>你可以叫我Kyle。<br>我曾在文學與戲劇裡追尋答案，也總在痛苦與荒誕間迷路。<br>如果你恰好路過這裡，請坐，同我一起聽聽潮汐。
  </p>

  <h2>我正在學</h2>
  <div id="progress-container"></div>

  <h2>作品</h2>
  <div id="works-container"></div>
  <p class="all-works-link"><a href="works.html">查看全部作品 →</a></p>

  <h2>興趣</h2>
  <p>心理學、文學、戲劇、遊戲</p>

  <script src="works-render.js"></script>
  <script src="nav.js"></script>
  <script>
    renderWorks('works-container', 3);
    renderNav('nav-container');

    const plans = [
      { name: "統計", start: "2026-5-20", total: 90, studied: 76, recent: "因素分析" },
      { name: "多益備考", start: "2026-6-28", total: 60, studied: 35, recent: "Mock Test" }
    ];

    function renderProgress(containerId) {
      let HTML = '';
      for (const progress of plans) {
        const now = new Date()
        const start = new Date(progress.start);
        const diffMs = now - start;
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const percent = progress.studied / progress.total * 100
        HTML += `
          <div class="progress-section"${progress.name === "多益備考"? ' id="toeic-section"' : ""}>
          <p class="progress-label">${progress.name} <br> 學習進度： ${progress.studied}/${progress.total}天（${diffDays}前開始）</p>
           <div class="progress-bar-bg">
           <div class="progress-bar-fill" style="width: ${percent}%"></div>
           </div>
           <p class="progress-content">目前位置：${progress.recent}</p>
        </div>
            `;
      }
      document.getElementById(containerId).innerHTML = HTML;
    }

    async function loadQuote() {
      const response = await fetch('https://dummyjson.com/quotes/random');
      const data = await response.json();   
      const qttext = document.getElementById('quote-text');
      qttext.innerText ='一天一則英文句子：\n "' + data.quote + '" \u00A0--by ' + data.author;
    }

    function setupQuoteSection() {
      const toeic = document.getElementById('toeic-section');
      toeic.insertAdjacentHTML(
        'beforeend', `<p id="quote-text" class="progress-content"></p>
        <button id= "quote-btn">換一句</button>`
      )
      const qtbtn = document.getElementById('quote-btn')
      qtbtn.addEventListener("click", loadQuote);
    }

    renderProgress('progress-container');  // 先讓 toeic-section 存在
    setupQuoteSection();                    // 再建立名言結構跟按鈕
    loadQuote();                            // 最後填入第一句
  </script>

</body>
</html>
