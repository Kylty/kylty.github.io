<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle</title>
  <style>
    html {
      min-height: 100%;
    }

    body {
      background: linear-gradient(180deg, #e8ded0 0%, #e0d6c4 55%, #d2cdb4 100%);
      background-attachment: fixed;
      color: #3d4a42;
      font-family: Georgia, serif;
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.9;
    }

    h1 {
      color: #4a5f5a;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      color: #a68c74;
      margin-top: 2.5rem;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #a68c74;
      padding-bottom: 0.5rem;
    }

    p {
      margin: 0 0 1rem;
    }

    a {
      color: #9a6850;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #a68c74;
    }

    .tagline {
      color: #8a7e6a;
      font-size: 1rem;
      margin-bottom: 2.5rem;
    }

    /* 作品卡片 */
    .work-card {
      display: flex;
      align-items: flex-start;
      gap: 1.1rem;
      margin-bottom: 1.75rem;
    }

    .work-thumb {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #d9c9ae;
      color: #9a6850;
      border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
      transition: transform 0.3s ease;
    }

    .work-thumb svg {
      width: 30px;
      height: 30px;
    }

    .work-card:hover .work-thumb {
      transform: scale(1.08) rotate(3deg);
    }

    .work-info a {
      font-size: 1rem;
    }

    .work-date {
      font-size: 0.85rem;
      color: #8a7e6a;
      margin: 0.15rem 0 0.3rem;
    }

    .work-desc {
      font-size: 0.9rem;
      color: #5c5347;
      margin: 0;
    }

    .all-works-link {
      font-size: 0.9rem;
    }

    /* 當螢幕寬度小於 600px 時（手機） */
    @media (max-width: 600px) {
      body {
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .work-thumb {
        width: 52px;
        height: 52px;
      }
      .work-thumb svg {
        width: 26px;
        height: 26px;
      }
    }
  </style>
</head>
<body>

  <h1>Kyle</h1>
  <p class="tagline">這是一片小小的、雜亂的潮間帶。</p>

  <h2>關於我</h2>
  <p>一枚不起眼的小拼圖塊，費盡一生在尋找那塊空白。<br><br>你可以叫我Kyle。<br>我曾在文學與戲劇裡追尋答案，也總在痛苦與荒誕間迷路。<br>如果你恰好路過這裡，請坐，同我一起聽聽潮汐。
  </p>

  <h2>我現在正在</h2>
  <p>從零開始學統計與Python。<br>目標是進入心理學領域。這裡會慢慢記錄這段路。</p>

  <h2>作品</h2>
  <div id="works-container"></div>
  <p class="all-works-link"><a href="works.html">查看全部作品 →</a></p>

  <h2>興趣</h2>
  <p>心理學、文學、戲劇、遊戲</p>

  <script src="works-render.js"></script>
  <script>
    renderWorks('works-container', 3);
  </script>

</body>
</html>
