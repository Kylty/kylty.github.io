<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咖啡店的下午</title>
  <style>

    /* 標題畫面的容器 */
    #title-screen {
    text-align: center;
    padding: 60px 0;
    transition: opacity 0.8s;  /* 淡出動畫 */
    }

    /* 標題文字 */      
    #title {
    font-size: 2rem;
    font-weight: normal;
    letter-spacing: 2px;
    margin-bottom: 0.5rem;
    }

    /* 副標題文字 */       
    #subtitle {
    font-size: 0.9rem;
    color: #a09888;
    margin-bottom: 3rem;
    letter-spacing: 1px;
    }

    /* 淡出動畫(本身不做事，等待後續javaScript加上去) */
    .fade-out {
    opacity: 0;  /* 透明度降到 0，觸發淡出 */
    }

    /* 整個頁面的基礎設定 */
    body {
      background-color: #1a1a2e;
      color: #e0d6c8;
      font-family: Georgia, serif;
      max-width: 620px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 2;
    }

    /* 故事敘述文字的區塊 */
    #scene-text {
      font-size: 1.1rem;
      margin-bottom: 2rem;
      min-height: 80px;
      transition: opacity 0.4s;  /* 場景切換時淡出 */
    }
    
    /* 場景淡出的觸發條件， */ 
    /* 當 scene-text 同時擁有 hidden class 時，opacity 變成 0。 */
    #scene-text.hidden {
      opacity: 0;
    }

    /* 所有選項按鈕的樣式。 */
    .choice-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid #e0d6c8;
      color: #e0d6c8;
      font-family: Georgia, serif;
      font-size: 0.95rem;
      padding: 12px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      transition: background 0.2s;
    }

    /*滑鼠懸停在按鈕上時的樣式。:hover 是一種「偽類」，代表「當滑鼠在上面的時候」。*/
    .choice-btn:hover {
      background: rgba(224, 214, 200, 0.1);
    }

    /*選項按鈕的容器，只設定了上方間距。*/
    #choices {
      margin-top: 1.5rem;
    }

        /* 導覽列 */
    nav {
      margin-bottom: 3rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    nav a {
      color: #8a7e6a;
      text-decoration: none;
      margin-right: 1.5rem;
      text-transform: uppercase;
    }

    nav a:hover {
      color: #4a5f5a;
    }

    nav a.nav-active {
      color: #3d4a42;
      font-weight: bold;
      text-decoration: none;
    }
    /* 當螢幕寬度小於 600px 時（手機） */
    @media (max-width: 600px) {
      body {
        margin: 40px auto;  /* 手機上縮小上下間距 */
        padding: 0 16px;    /* 手機上縮小左右內距 */
      }

      h1 {
        font-size: 1.6rem;  /* 手機上標題稍微縮小 */
      }
    }

  </style>
</head>

<body>
  <nav id="nav-container"></nav>
  <div id="title-screen"> <!-- 1. 標題畫面 -->
    <h1 id="title">咖啡店的下午</h1>
    <p id="subtitle">一場關於迷途的夢</p>
    <button id="start-btn" class="choice-btn">走進去</button>
    <p id="endings-count" style="font-size:0.85rem; color:#a09888; margin-top:0.5rem;"></p>  
  </div>

  <div id="game" style="display:none">   <!-- 2. 遊戲畫面 -->
      
    <div id="scene-text"></div>
    <div id="choices"></div>
    </div> <!-- 關閉 #game -->

  <script>  
    /* ── Scene / EndingScene class ── */
    class Scene {
      constructor(text, choices) {
        this.text = text;
        this.choices = choices;
      }
    }

    class EndingScene extends Scene {
      constructor(text, choices, endingId) {
        super(text, choices);
        this.endingId = endingId;
      }
      unlock() {
        const key = 'ending_' + this.endingId;
        localStorage.setItem(key, 'true');
        updateEndingsCount();
      }
    }

    /* ── 故事資料 ── */
    const start = new Scene(
      '你在咖啡店裡閱讀。手邊一杯拿鐵已經喝空，杯壁上紋著一圈一圈的咖啡漬，好像浪在沙灘上留下的足跡。\n你不禁有些昏昏欲睡，視線開始朦朧......',
      [
        { label: '閉上雙眼。', next: 'close' },
        { label: '進入空杯。', next: 'cup' }
      ]
    );

    const close = new Scene(
      '即便闔上雙眼，世界卻不是一片漆黑。你依稀可見橙色的燈光在眼前晃盪，人影左右搖曳，你分不清處哪邊是開始，哪邊是盡頭。有一隻藍色貓站在樹上看著你。\n「你在等什麼？」他問道。',
      [
        { label: '「我只是路過。」', next: 'tree' },
        { label: '「我在等一切好轉。」', next: 'end_a' }
      ]
    );

    const cup = new Scene(
      '你鑽進了杯子裡面。你很快聞到一陣濃郁的咖啡香，一片咖啡色的海洋在你面前蕩漾。浪花仍然是白色，但上面帶著濃郁的奶泡。你突然有一個念頭，想要轉身就跑。',
      [
        { label: '「為什麼想逃跑？」你問自己。', next: 'escape' },
        { label: '逃跑', next: 'end_b' }
      ]
    );

    const tree = new Scene(
      '貓咪笑了。「我們誰不是路過？但你總得帶走些什麼。」說完，他從樹上摘了一顆星星，扔給了你。「現在，繼續迷你的路吧。」',
      [
        { label: '將星星收進口袋。', next: 'end_c' }
      ]
    );

    const escape = new Scene(
      '根本沒理由逃跑。你對自己說。你走向海浪，咖啡味幾乎有些刺鼻，你單膝跪地，將手伸進裡面。海浪化作一圈漩渦，將你緩緩拉入。不知怎地，你不是很想反抗。',
      [
        { label: '任由吞沒。', next: 'end_d' }
      ]
    );

    const end_a = new EndingScene(
      '「那你便繼續等吧。」貓呵呵笑著。他轉身，隱身進樹叢裡，再也看不見了。我坐在樹下，等著他回來。\n\n— 完 —',
      [
        { label: '回首頁', next: 'title' }
      ],
      'end_a'
    );

    const end_b = new EndingScene(
      '你轉身，狼狽地跑了起來。你想逃離這個是非之地，想逃離這個荒謬的世界。突然，你發覺自己仍坐在那間咖啡廳裡，手邊的咖啡杯已經空了許久。\n\n— 完 —',
      [
        { label: '回首頁', next: 'title' }
      ],
      'end_b'
    );

    const end_c = new EndingScene(
      '你睜開雙眼，發現自己仍在那間咖啡廳。客人紛紛攘攘，遠處一個孩子吵著要吃蛋糕。你感覺到褲子有什麼東西硬硬的，摸了摸口袋。裡面有一顆發票摺成的星星。\n\n— 完 —',
      [
        { label: '回首頁', next: 'title' }
      ],
      'end_c'
    );

    const end_d = new EndingScene(
      '你很快地失去意識。忽然，你醒了過來，發覺身旁的人忙碌著，咖啡撒了一地，滴答滴答，在地上蜿蜒成一道小溪流，慢慢延伸到你的鞋子。\n\n— 完 —',
      [
        { label: '回首頁', next: 'title' }
      ],
      'end_d'
    );

    const story = { start, close, cup, tree, escape, end_a, end_b, end_c, end_d };
    /* 引擎：更新標題畫面的解鎖數量 */
    function updateEndingsCount() {
      const endings = ['end_a', 'end_b', 'end_c', 'end_d'];  /* 所有結局的 id */
      let count = 0;                                           /* 計數器，從 0 開始 */
      endings.forEach(function(id) {
        if (localStorage.getItem('ending_' + id) === 'true') { /* 如果這個結局已解鎖 */
          count++;                                              /* 計數器加一 */
        }
      });
      const total = endings.length;          /* 自動計算總數 */
      const display = document.getElementById('endings-count');
      display.textContent = '已解鎖結局：' + count + ' / ' + total;
    }

    /* ── 引擎：讀取場景並顯示 ── */
    function showScene(sceneId) {

    /* 特殊場景：回到標題畫面 */
    if (sceneId === 'title') {
        game.style.display = 'none';
        titleScreen.style.display = 'block';
        setTimeout(function() {
        titleScreen.classList.remove('fade-out'); //使回到標題時恢復可見。
        }, 50);
        showScene('start');  /* ← 加這行：重置到開頭場景 */
        return;  /* 直接結束函式，不往下執行 */
    }

      const scene = story[sceneId];
      /* 如果是結局場景，自動解鎖 */
      if (scene instanceof EndingScene) {
        scene.unlock();
      }
      const sceneText = document.getElementById('scene-text');
      const choicesDiv = document.getElementById('choices');

      /* 先淡出 */
      sceneText.classList.add('hidden');

      setTimeout(function() {
        /* 換內容 */
        sceneText.innerText = scene.text;
        choicesDiv.innerHTML = '';    

      /* 根據場景的選項，動態生成按鈕*/
      scene.choices.forEach(function(choice) {
        const btn = document.createElement('button'); // 建立一個新的按鈕元素
        btn.className = 'choice-btn'; 
        btn.textContent = choice.label; // 設定它的文字
        btn.addEventListener('click', function() { // 給它一個點擊事件
          showScene(choice.next); // 點了之後跳到下一個場景
        });
        choicesDiv.appendChild(btn); // 把它放進頁面裡
      });
        /* 淡入 */
        sceneText.classList.remove('hidden');

      }, 400);  /* 等淡出動畫跑完再換內容 */


    }
    
    /* ── 標題畫面 ── */
    const titleScreen = document.getElementById('title-screen');
    const game = document.getElementById('game');
    const startBtn = document.getElementById('start-btn');
    
    /* 幫StartBtn 加上監聽器 */
    startBtn.addEventListener('click', function() {
    titleScreen.classList.add('fade-out');        /* 加上淡出 class */

    setTimeout(function() {                        /* 等 0.8 秒後執行 */
        titleScreen.style.display = 'none';          /* 完全隱藏標題畫面 */
        game.style.display = 'block';                /* 顯示遊戲 */
    }, 800);                                       /* 800ms = 0.8 秒 */
    });

    updateEndingsCount();  /* 頁面載入時，立刻計算並顯示解鎖數量 */

    /* 從開頭開始 */
    showScene('start');

  </script>
  <script src="nav.js"></script>
  <script>
    renderNav('nav-container');
  </script>

</body>
</html>
