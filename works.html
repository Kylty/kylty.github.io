<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部作品 - Kyle</title>
  <style>
    body {
      background-color: #e8ded0;
      color: #3d4a42;
      font-family: Georgia, serif;
      max-width: 680px;
      margin: 80px auto;
      padding: 0 24px;
      line-height: 1.9;
    }

    h1 {
      color: #4a5f5a;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: -0.5px;
      margin-bottom: 1.5rem;
    }

    p {
      margin: 0 0 1rem;
    }

    a {
      color: #9a6850;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      color: #a68c74;
    }

    .back-link {
      display: block;
      color: #8a7e6a;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .work-item {
      margin-bottom: 1.25rem;
    }

    .work-item a {
      font-size: 1rem;
    }

    .work-item p {
      font-size: 0.9rem;
      color: #8a7e6a;
      margin: 0.1rem 0 0;
    }

    /* 當螢幕寬度小於 600px 時（手機） */
    @media (max-width: 600px) {
      body {
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <a class="back-link" href="index.html">← 回首頁</a>
  <h1>全部作品</h1>

  <div id="all-works-container"></div>

  <script src="works-render.js"></script>
  <script>
    renderWorks('all-works-container');
  </script>

</body>
</html>
